# ─────────────────────────────────────────────
#  LOGINX CONFIG
# ─────────────────────────────────────────────

# --- KÜFÜR / SPAM ALGILAMA SİSTEMİ RENKLERİ ---
# Renkleri hex kodu olarak (başında # ile, & olmadan) yazın.
# uyari-rengi  -> "KÜFÜR Uyarısı" / "SPAM Uyarısı" etiketinin rengi (örn: 1/5, 2/5...)
# mute-rengi   -> 5/5 olup susturulduğunda gösterilen "10 dakika susturuldun!" mesajının rengi
kufur:
  uyari-rengi: "#d6a45c"
  mute-rengi: "#ff4444"

# --- ÇİFT ZIPLAMA ---
# bekleme: saniye (/ciftziplama saniye <süre> ile de değişir)
# yatay-hiz / dikey-hiz: sıçrama gücü, sunucuda deneyerek ayarla
ciftziplama:
  bekleme: 2.0
  yatay-hiz: 1.1
  dikey-hiz: 0.42

# --- KONT ---
# /kontcikar işlemi bittikten (eşyalar iade edildikten) hemen sonra konsoldan çalıştırılır.
# {oyuncu} yerine kontten çıkarılan oyuncunun adı yazılır. Başındaki / isteğe bağlıdır.
kont:
  hub-komutu: "hub {oyuncu}"

# --- EŞYA DÜŞMEME ---
# dunya: bu dünyada ölünce eşya düşmez. Sadece /esyadusmeolustur ile tanımlanan bölgelerde düşer.
esyadusme:
  dunya: "mc.minerya.tc"

# --- 1V1 ROOM ---
# hub-komutu: düello bitince/oyuncu atılınca konsoldan çalışır ({oyuncu} = oyuncu adı)
# bitis-bekleme: kazananın lobiye gitmeden önceki bekleme süresi (saniye)
oda:
  hub-komutu: "hub {oyuncu}"
  bitis-bekleme: 5

# --- DUEL / 1V1 ROOM KOMUT KİLİDİ ---
# lobi-komutlari: düello/oda SONUCU belli olduktan sonra (kazanan geri sayımı, ölüm sonrası kilit) serbest bırakılan komutlar.
# Düello sürerken kilit aynen devam eder. Boş bırakılırsa varsayılan: hub, lobby, spawn
duel:
  lobi-komutlari: [hub, lobby, spawn]

# --- KORUMA: ENGELLER ---
# engellenen-warplar: koruma altındayken /warp <isim> ile gidilemeyen warp'lar (Essentials varsa oraya giden her ışınlanma da iptal edilir)
# warp-komutlari: "warp" komutunun takma adları
# portal-paketleri: ışınlanmayı bu paketlerden biri tetiklerse portal sayılır ve koruma altındakiler geçemez (tüm Advanced Portals portalları dahil)
koruma:
  engellenen-warplar: [end]
  warp-komutlari: [warp, ewarp]
  portal-paketleri: ["com.sekwah.advancedportals", "com.onarandombox.multiverseportals"]

# --- OYUNCU İSİM HUD ---
# Düzen (2 satır, tek yazı):   [Klan]  Can 20     <- üst satır, klan ve can aynı satırda
#                              Prefix Nick        <- alt satır (vanilla nick gizlenir, gri arka plan yok)
# mod: "yolcu" = yazı oyuncuya binmiştir, yürürken/koşarken SIFIR gecikme, her zaman sabit.
#      "takip" = yazı bağımsızdır ve oyuncuyu ışınlayarak takip eder (hafif gecikme olur ama ışınlanmayı hiç etkilemez).
# yolcu.komutlar: bu komutlar yazılınca HUD kısa süre sökülür (yolcu varken ışınlanma reddedilir). Süre: yolcu.komut-sure (sn)
# yolcu.portal-bloklari: bu blokların yanında HUD takılmaz (Advanced Portals'ın kullandığı blok türlerini ekle, örn. "WATER")
# konum.taban-px: ince ayar (yazı nick'e göre yüksekse küçült, alçaksa büyült; 1 piksel = 0.025 blok)
# vanilla-isim-gizle: true = oyunun kendi nick etiketi (gri arka planlı) gizlenir, nick HUD içinde çizilir
# klan.renkler: yavaş geçiş yapan renkler (hex), klan.hiz: küçük = daha yavaş
# klan.gosterim: isim | tag
hud:
  aktif: true
  mod: "yolcu"
  textshadow: true
  guncelleme-tick: 4
  konum:
    olcek: 1.0
    taban-px: 3.5
    takip-tick: 1
    yumusatma-tick: 2
  yolcu:
    komut-sure: 8
    komutlar: [hub, lobby, spawn, warp, ewarp, home, ehome, tpa, tpaccept, tpyes, back, rtp, tp, tpo, tphere, kit, duel, 1v1, 1v1kabul, dueller]
    portal-bloklari: [NETHER_PORTAL, END_PORTAL, END_GATEWAY]
  duvar-arkasi: false
  nick-goster: true
  prefix-goster: true
  isim-rengi: "#ffffff"
  vanilla-isim-gizle: true
  klan:
    gosterim: "isim"
    kalin: false
    hiz: 0.012
    yayilim: 0.09
    renkler: ["#ff9ecb", "#ffffff", "#ff7ab6", "#ffffff"]

# --- KASA / HOLOGRAM VERİLERİ ---
# Buradan sonrası plugin tarafından otomatik yönetilir (crates, crateColors, kontyeri,
# kontyetkili, izinli, vb.) — elle düzenlemeniz gerekmez, /kasarenkayarla ve diğer
# komutlar buraya kendi kendine yazar.
